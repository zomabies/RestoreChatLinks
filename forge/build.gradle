plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    //accessWidenerPath = project(":common").loom.accessWidenerPath
    mixin.defaultRefmapName = "${archivesBaseName.toLowerCase()}-refmap.json"

    forge {
        //convertAccessWideners = true
        //extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        //mixinConfig "restorechatlinks-common.mixins.json"
        //mixinConfig "restorechatlinks.mixins.json"
        useForgeLoggerConfig = true
    }

    runs {
        client {
            vmArgs '-Xmx1512M'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            vmArgs('-Xmx1512m')
        }
    }

}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories{
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    // Remove the next line if you don't want to depend on the API
    // modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    // modImplementation "curse.maven:configured-457570:5105022"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "RestoreChatLink",
                "Specification-Vendor"    : "Zom",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${project.version}",
                "Implementation-Vendor"   : "Zom",
        ])
    }
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

def hasSigning = SignJarExt.hasSigning(project)

def signForgeJar = SignJarExt.createSignJarTask(
        project,
        tasks.named("remapJar", net.fabricmc.loom.task.RemapJarTask),
        hasSigning
)
signForgeJar.configure {
    refTimeStampFile = 'mods.toml'
}

if (hasSigning) {
    // continue from main gradle file https://stackoverflow.com/a/54094378
    compileJava {
        source = processSource.outputs
    }

    // enable signing on build
    tasks.named("build").configure {
        dependsOn signForgeJar
    }
}


components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
