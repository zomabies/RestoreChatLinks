plugins {
    id "com.gradleup.shadow" version "8.3.11"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    //accessWidenerPath = project(":common").loom.accessWidenerPath
//    mixin.useLegacyMixinAp = true
//    mixin.defaultRefmapName = "${base.archivesName.get().toLowerCase()}-refmap.json"
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}


repositories {
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    // modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    api "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.5"

    // runtimeOnly "curse.maven:configured-457570:7943179"
    runtimeOnly "com.terraformersmc:modmenu:18.0.1"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

/*remapJar {
    injectAccessWidener = true
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}*/

jar {
    manifest {
        attributes([
                "Specification-Title"     : "RestoreChatLink",
                "Specification-Vendor"    : "Zom",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${project.version}",
                "Implementation-Vendor"   : "Zom",
        ])
    }
    archiveClassifier = "dev"
}

shadowJar {
    exclude "architectury.common.json"
    dependsOn(jar)

    doFirst {
        manifest {
            from(zipTree(jar.archiveFile).find { it.name.equals("MANIFEST.MF") }) // Keep manifest with loom modification
        }
    }

    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

assemble.dependsOn(shadowJar) // emulate "remapJar", added by loom in obf version

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

def hasSigning = SignJarExt.hasSigning(project)

def signFabricJar = SignJarExt.createSignJarTask(
        project,
        tasks.named("shadowJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar),
        hasSigning
)
signFabricJar.configure {
    refTimeStampFile = 'fabric.mod.json'
}

if (hasSigning) {
    // continue from main gradle file https://stackoverflow.com/a/54094378
    compileJava {
        source = processSource.outputs
    }

    // enable signing on build
    tasks.named("build").configure {
        dependsOn signFabricJar
    }
}


components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
